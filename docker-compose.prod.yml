services:
    mongo:
        image: mongo:7
        container_name: fashion-mongo-prod
        restart: unless-stopped
        volumes:
            - mongo_data_prod:/data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
        container_name: fashion-backend-prod
        restart: unless-stopped
        ports:
            - '3001:3001'
        env_file:
            - ./backend/.env.docker
        environment:
            PORT: 3001
            CLIENT_URL: http://localhost:8080
        depends_on:
            mongo:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 5

    frontend:
        build:
            context: ./frontend
            target: production
            args:
                VITE_API_URL_BACKEND: ${VITE_API_URL_BACKEND:-http://localhost:3001}
        container_name: fashion-frontend-prod
        restart: unless-stopped
        ports:
            - '8080:80'
        depends_on:
            backend:
                condition: service_healthy

volumes:
    mongo_data_prod:
