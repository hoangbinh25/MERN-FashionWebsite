services:
    mongo:
        image: mongo:7
        container_name: fashion-mongo
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
        container_name: fashion-backend
        ports:
            - '3001:3001'
        env_file:
            - ./backend/.env.docker
        environment:
            PORT: 3001
        depends_on:
            mongo:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
            interval: 15s
            timeout: 5s
            retries: 5

    frontend:
        build:
            context: ./frontend
            target: development
        container_name: fashion-frontend
        ports:
            - '5173:5173'
        environment:
            VITE_API_URL_BACKEND: http://localhost:3001
        depends_on:
            backend:
                condition: service_healthy

volumes:
    mongo_data:
