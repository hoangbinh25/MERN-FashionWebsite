services:
    mongo:
        image: mongo:7
        container_name: fashion-mongo
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db

    backend:
        build:
            context: ./backend
        container_name: fashion-backend
        ports:
            - '3001:3001'
        env_file:
            - ./backend/.env.docker
        environment:
            PORT: 3001
        depends_on:
            - mongo

    frontend:
        build:
            context: ./frontend
        container_name: fashion-frontend
        ports:
            - '5173:5173'
        environment:
            VITE_API_URL_BACKEND: http://localhost:3001
        depends_on:
            - backend

volumes:
    mongo_data:
